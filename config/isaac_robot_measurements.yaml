      camera_assembly_rpy: [0.0, 0.0, 0.0]  # ROS body axes, not optical-frame axes.
      orientation_source: user_confirmed_straight_forward_and_level
      note: >-
        User reported lenses 170 mm above the floor, 70 mm from the front
        (interpreted as behind the front edge), 60 mm apart, with the pair
        centred left-to-right. Left/right follow ROS body axes (+Y left).
        Conversion to base_link requires the front-edge and floor offsets
        relative to that frame. User confirmed straight forward and level. Physical
        lens spacing does not replace calibrated stereo extrinsics.
    hardware_frame_sync: false
    jetson_camera_inventory:
