# Hardware preview; motors connect only through the guarded trial helper.
/**:
  ros__parameters:
    use_sim_time: false
    enable_stamped_cmd_vel: false
/hardware_navigation/controller_server:
  ros__parameters:
    controller_frequency: 15.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.0
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - goal_checker
    - position_goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.1
      movement_time_allowance: 20.0
    # Keep this tolerance equal to FollowPath.xy_goal_tolerance below.
    # DWB RotateToGoal caches its tolerance on initialization: restart the
    # Nav2 preview after changing it, even if live parameter updates succeed.
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.15
      stateful: true
    # Explicit position-only arrival mode; the 5 cm position bound is unchanged.
    # Angular error is wrapped to [-pi, pi], so this accepts any final heading.
    position_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 3.141592653589793
      stateful: true
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.12
      max_vel_y: 0.0
      max_vel_theta: 0.3
      min_speed_xy: 0.0
      max_speed_xy: 0.12
      min_speed_theta: 0.0
      acc_lim_x: 0.15
      acc_lim_y: 0.15
      acc_lim_theta: 0.3
      decel_lim_x: -0.15
      decel_lim_y: -0.15
      decel_lim_theta: -0.3
      vx_samples: 12
      vy_samples: 1
      vtheta_samples: 16
      sim_time: 2.0
      linear_granularity: 0.025
      angular_granularity: 0.025
      transform_tolerance: 0.3
      xy_goal_tolerance: 0.05
      trans_stopped_velocity: 0.03
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
      - RotateToGoal
      - Oscillation
      - BaseObstacle
      - GoalAlign
      - PathAlign
      - PathDist
      - GoalDist
      BaseObstacle.scale: 0.05
      PathAlign.scale: 0.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 0.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 24.0
      GoalDist.scale: 20.0
      RotateToGoal.scale: 24.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
    odom_topic: /localization/odom
/hardware_navigation/planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.05
      use_astar: true
      allow_unknown: false
/hardware_navigation/smoother_server:
  ros__parameters:
    smoother_plugins:
    - simple_smoother
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
/hardware_navigation/behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - wait
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait
    local_frame: localization_odom
    global_frame: localization_map
    robot_base_frame: laser
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.3
    min_rotational_vel: 0.1
    rotational_acc_lim: 0.3
/hardware_navigation/bt_navigator:
  ros__parameters:
    global_frame: localization_map
    robot_base_frame: laser
    odom_topic: /localization/odom
    bt_loop_duration: 10
    default_server_timeout: 1000
    wait_for_service_timeout: 1000
    navigators:
    - navigate_to_pose
    - navigate_through_poses
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
/hardware_navigation/velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    feedback: OPEN_LOOP
    scale_velocities: true
    max_velocity:
    - 0.12
    - 0.0
    - 0.3
    min_velocity:
    - 0.0
    - 0.0
    - -0.3
    max_accel:
    - 0.15
    - 0.15
    - 0.3
    max_decel:
    - -0.15
    - -0.15
    - -0.3
    odom_topic: /localization/odom
    odom_duration: 0.1
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 0.35
/hardware_navigation/local_costmap/local_costmap:
  ros__parameters:
    use_sim_time: false
    update_frequency: 8.0
    publish_frequency: 4.0
    global_frame: localization_odom
    robot_base_frame: laser
    rolling_window: true
    width: 4
    height: 4
    resolution: 0.05
    footprint_padding: 0.05
    plugins:
    - obstacle_layer
    - inflation_layer
    obstacle_layer:
      plugin: nav2_costmap_2d::ObstacleLayer
      observation_sources: scan
      scan:
        topic: /scan
        data_type: LaserScan
        clearing: true
        marking: true
        inf_is_valid: true
        obstacle_max_range: 7.5
        raytrace_max_range: 8.0
        max_obstacle_height: 2.0
    inflation_layer:
      plugin: nav2_costmap_2d::InflationLayer
      inflation_radius: 0.4
      cost_scaling_factor: 5.0
    always_send_full_costmap: true
/hardware_navigation/global_costmap/global_costmap:
  ros__parameters:
    use_sim_time: false
    update_frequency: 2.0
    publish_frequency: 1.0
    global_frame: localization_map
    robot_base_frame: laser
    resolution: 0.05
    footprint_padding: 0.05
    track_unknown_space: true
    plugins:
    - static_layer
    - obstacle_layer
    - inflation_layer
    static_layer:
      plugin: nav2_costmap_2d::StaticLayer
      map_subscribe_transient_local: true
      map_topic: /localization/map
    obstacle_layer:
      plugin: nav2_costmap_2d::ObstacleLayer
      observation_sources: scan
      scan:
        topic: /scan
        data_type: LaserScan
        clearing: true
        marking: true
        inf_is_valid: true
        obstacle_max_range: 7.5
        raytrace_max_range: 8.0
        max_obstacle_height: 2.0
    inflation_layer:
      plugin: nav2_costmap_2d::InflationLayer
      inflation_radius: 0.4
      cost_scaling_factor: 5.0
    always_send_full_costmap: true
