/**:
  ros__parameters:
    use_sim_time: false

/localization/icp_odometry:
  ros__parameters:
    # Localize the scan centre, without inventing an unmeasured chassis origin.
    frame_id: laser
    odom_frame_id: localization_odom
    publish_tf: true
    qos: 2
    wait_for_transform: 1.0
    Reg/Force3DoF: 'true'
    Icp/PointToPlane: 'false'
    Icp/CorrespondenceRatio: '0.3'
    Icp/MaxCorrespondenceDistance: '0.15'
    Icp/VoxelSize: '0.03'
    Odom/GuessMotion: 'true'

/localization/map_server:
  ros__parameters:
    frame_id: localization_map
    topic_name: map

/localization/amcl:
  ros__parameters:
    global_frame_id: localization_map
    odom_frame_id: localization_odom
    base_frame_id: laser
    scan_topic: /scan
    robot_model_type: nav2_amcl::OmniMotionModel
    tf_broadcast: true
    transform_tolerance: 0.5
    set_initial_pose: false
    always_reset_initial_pose: true
    save_pose_rate: 0.5
    min_particles: 500
    max_particles: 2000
    max_beams: 90
    laser_min_range: 0.15
    laser_max_range: 8.0
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 2.0
    sigma_hit: 0.2
    z_hit: 0.8
    z_rand: 0.2
    do_beamskip: false
    update_min_d: 0.05
    update_min_a: 0.05
    resample_interval: 1
    # Initial noise assumptions; stationary success does not validate motion.
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

/localization/lifecycle_manager:
  ros__parameters:
    autostart: true
    node_names: [map_server, amcl]
